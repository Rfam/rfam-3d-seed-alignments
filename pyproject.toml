[project]
name = "rfam-3d-seed-alignments"
version = "0.1.0"
description = "A tool to align 3D structures into Rfam SEED alignments"
authors = [
  { name = "Blake Sweeney", email ="<bsweeney@ebi.ac.uk>" }
]
license = {text = "apache-2.0"}
requires-python = ">=3.11"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/Rfam/rfam-3d-seed-alignments"
Repository = "https://github.com/Rfam/rfam-3d-seed-alignments.git"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
loguru = "^0.7.2"
click = "^8.1.7"
bio = "^1.7.1"
attrs = "^24.2.0"
cattrs = "^24.1.2"
pyyaml = "^6.0.2"
requests = "^2.32.3"
diskcache = "^5.6.3"
requests-ratelimiter = "^0.7.0"

[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
isort = "^5.13.2"
pyright = "^1.1.382.post1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = "--doctest-modules"
